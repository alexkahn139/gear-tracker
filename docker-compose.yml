services:
  gear-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gear-tracker:latest
    container_name: gear-tracker
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
